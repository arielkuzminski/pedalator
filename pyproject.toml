[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pedalator"
version = "0.2.0"
description = "Ride games with your smart trainer: turns pedalling into game input and the game's hills into trainer resistance."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Ariel Kuźmiński" }]
keywords = ["smart trainer", "FTMS", "Bluetooth", "cycling", "OpenMW", "Morrowind", "OMSI", "Zwift Click", "game controller"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "bleak>=3.0",           # Bluetooth LE (direct connection from the PC)
  "cryptography>=50",     # the private CA and certificate for phone mode (HTTPS)
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.16"]
demo = ["pillow>=12"]       # tools/make_demo.py

[project.scripts]
pedalator = "pedalator.cli:main"

[project.urls]
Homepage = "https://github.com/arielkuzminski/pedalator"
Issues = "https://github.com/arielkuzminski/pedalator/issues"

[tool.setuptools.packages.find]
include = ["pedalator*"]

[tool.setuptools.package-data]
pedalator = ["web/*.html", "web/*.js", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
