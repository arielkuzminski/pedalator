name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Trainer and controller models, game and version, Windows version; for phone mode the phone and browser.
      placeholder: "Trainer: ...\nController: ...\nGame: ...\nPC: ...\nPhone mode: yes/no (device, browser)"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Console output and the dashboard's Event log
      description: See docs/troubleshooting.md, "Collecting information for a bug report".
      render: text
