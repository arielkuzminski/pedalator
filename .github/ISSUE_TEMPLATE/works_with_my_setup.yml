name: Works / does not work with my setup
description: Tell us what you tried, so the compatibility table can grow
labels: [compatibility]
body:
  - type: input
    id: trainer
    attributes:
      label: Trainer (brand, model)
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller (for example Zwift Click v2), or none
  - type: input
    id: game
    attributes:
      label: Game and version
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options: [Works fully, Works partly, Does not work]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
